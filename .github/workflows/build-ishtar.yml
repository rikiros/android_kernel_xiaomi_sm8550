# Kernel build for Xiaomi 13 Ultra (ishtar) on AlphaDroid 4.7.
# Source is pinned to the exact commit the ROM's kernel was built from.
# Output: an AnyKernel3 zip that replaces only the kernel Image in the boot partition.
# The ROM's own modules (vendor_dlkm / vendor_boot) and init_boot are left untouched,
# so every change here must keep the module interface (symbol CRCs) identical to the
# baseline build. The "ABI gate" step enforces that and fails the run otherwise.

name: Build ishtar kernel

on:
  workflow_dispatch:
    inputs:
      lto:
        description: "LTO mode (thin = faster, safer on memory; full = same as the ROM build)"
        type: choice
        options:
          - thin
          - full
        default: full
      bbr:
        description: "Build in TCP BBR and make it the default congestion control"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

env:
  BASELINE_RUN_ID: "42991796427"
  KERNEL_REPO: ishtar-aosp/android_kernel_xiaomi_sm8550
  KERNEL_SHA: 34eaaccbb3d71edb8e03eb903d113e0e105b6237
  KERNEL_RELEASE: 5.15.211-g34eaaccbb3d7
  LOCALVER: -g34eaaccbb3d7
  MAKE_ARGS: O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 LOCALVERSION=
  KBUILD_BUILD_USER: build
  KBUILD_BUILD_HOST: github

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / /mnt || true

      - name: Add swap (full LTO link needs more memory than the runner has)
        run: |
          sudo fallocate -l 16G /mnt/swap-lto || sudo fallocate -l 16G /swap-lto
          f=/mnt/swap-lto; [ -f "$f" ] || f=/swap-lto
          sudo chmod 600 "$f"
          sudo mkswap "$f"
          sudo swapon "$f"
          free -h

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio kmod zip xz-utils python3 wget gnupg \
            lsb-release software-properties-common \
            libssl-dev libelf-dev dwarves
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y --no-install-recommends clang-21 lld-21 llvm-21
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          clang --version
          ld.lld --version
          pahole --version

      - name: Fetch kernel source (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_SHA }}
          path: kernel
          fetch-depth: 1

      - name: Configure (same recipe as the ROM device tree)
        working-directory: kernel
        run: |
          make $MAKE_ARGS gki_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/kalama_GKI.config \
            arch/arm64/configs/vendor/ishtar_GKI.config
          # Build-only changes: none of these alter the module interface.
          scripts/config --file out/.config \
            -d WERROR \
            -d LOCALVERSION_AUTO \
            --set-str LOCALVERSION "$LOCALVER"
          if [ "${{ inputs.lto }}" = "thin" ]; then
            scripts/config --file out/.config -d LTO_CLANG_FULL -e LTO_CLANG_THIN
          fi
          if [ "${{ inputs.bbr }}" = "true" ]; then
            scripts/config --file out/.config \
              -e TCP_CONG_ADVANCED -e TCP_CONG_CUBIC -e TCP_CONG_BBR \
              -d TCP_CONG_BIC -d TCP_CONG_WESTWOOD -d TCP_CONG_HTCP \
              -d DEFAULT_CUBIC -e DEFAULT_BBR
          fi
          make $MAKE_ARGS olddefconfig
          if [ "${{ inputs.bbr }}" = "true" ]; then
            grep -x 'CONFIG_DEFAULT_TCP_CONG="bbr"' out/.config
          fi
          grep -E '^CONFIG_(LOCALVERSION|LTO_CLANG_THIN|LTO_CLANG_FULL|MODVERSIONS|CFI_CLANG|DEBUG_INFO_BTF|MODULE_ALLOW_BTF_MISMATCH|TARGET_PRODUCT_ISHTAR|SCHED_WALT|HZ)=' out/.config
          cp out/.config "$GITHUB_WORKSPACE/kernel.config"

      - name: Print full config (for comparison with the phone's running config)
        working-directory: kernel
        run: |
          echo "::group::kernel config"
          grep -E '^(CONFIG_|# CONFIG_)' out/.config | sed 's/^/CFG| /'
          echo "::endgroup::"

      - name: Build kernel Image
        working-directory: kernel
        run: |
          set -o pipefail
          make -j"$(nproc)" $MAKE_ARGS Image 2>&1 | tee "$GITHUB_WORKSPACE/build.log" | tail -n 400
          ls -lh out/arch/arm64/boot/Image

      - name: Verify release string
        working-directory: kernel
        run: |
          strings out/arch/arm64/boot/Image > /tmp/image-strings.txt
          banner="$(grep -m1 '^Linux version [0-9]' /tmp/image-strings.txt || true)"
          echo "$banner"
          case "$banner" in
            "Linux version $KERNEL_RELEASE "*) echo "Release string matches the running kernel." ;;
            *) echo "::error::Release string differs from $KERNEL_RELEASE - do not flash."; exit 1 ;;
          esac
          cp out/vmlinux.symvers "$GITHUB_WORKSPACE/vmlinux.symvers" 2>/dev/null \
            || cp out/Module.symvers "$GITHUB_WORKSPACE/vmlinux.symvers" 2>/dev/null \
            || echo "No symvers file found (not fatal)."

      - name: Fetch baseline symbol table (build 1, verified on the phone)
        uses: actions/download-artifact@v4
        with:
          name: build-records
          path: baseline
          run-id: ${{ env.BASELINE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: ABI gate (exported symbols and CRCs must match the baseline)
        run: |
          # symvers columns: CRC, symbol, module, export type
          awk '{print $2, $1}' baseline/vmlinux.symvers | sort > base.txt
          awk '{print $2, $1}' vmlinux.symvers | sort > new.txt
          echo "baseline symbols: $(wc -l < base.txt), new build: $(wc -l < new.txt)"
          test "$(wc -l < base.txt)" -gt 1000
          comm -23 base.txt new.txt > broken.txt
          comm -13 base.txt new.txt > added.txt
          echo "added or changed in new build: $(wc -l < added.txt)"
          if [ -s broken.txt ]; then
            echo "::error::$(wc -l < broken.txt) baseline symbols are missing or have a different CRC - the ROM's modules may not load. Do not flash."
            head -n 50 broken.txt
            exit 1
          fi
          echo "ABI gate passed: every baseline symbol is present with an identical CRC."

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          cd ak3
          rm -rf .git .github README.md
          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 script - Xiaomi 13 Ultra (ishtar), kernel Image only
          properties() { '
          kernel.string=ishtar 5.15.211 custom build (kernel Image only)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=ishtar
          device.name2=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install: replace the kernel, keep everything else as it is
          split_boot;
          flash_boot;
          EOF
          cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" .
          zip -r9 "$GITHUB_WORKSPACE/ishtar-kernel-AK3.zip" .
          ls -lh "$GITHUB_WORKSPACE/ishtar-kernel-AK3.zip"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ishtar-kernel-AK3
          path: ishtar-kernel-AK3.zip

      - name: Upload build records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-records
          path: |
            kernel.config
            vmlinux.symvers
            build.log
          if-no-files-found: ignore
