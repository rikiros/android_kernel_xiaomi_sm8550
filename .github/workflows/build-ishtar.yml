# Kernel build for Xiaomi 13 Ultra (ishtar) on AlphaDroid 4.7.
# Source is pinned to the exact commit the ROM's kernel was built from.
# Output: an AnyKernel3 zip that replaces only the kernel Image in the boot partition.
# The ROM's own modules (vendor_dlkm / vendor_boot) and init_boot are left untouched,
# so every change here must keep the module interface (symbol CRCs) identical to the
# baseline build. The "ABI gate" step enforces that and fails the run otherwise.

name: Build ishtar kernel

on:
  workflow_dispatch:
    inputs:
      lto:
        description: "LTO mode (thin = faster, safer on memory; full = same as the ROM build)"
        type: choice
        options:
          - thin
          - full
        default: full
      bbr:
        description: "Build in TCP BBR and make it the default congestion control"
        type: boolean
        default: true

      ntsync:
        description: "Add the NT synchronization driver (/dev/ntsync) used by Wine-based gaming"
        type: boolean
        default: true

      extras:
        description: "futex_waitv syscall (Wine fsync), MGLRU on by default, NTFS3 driver"
        type: boolean
        default: true
      mglru:
        description: "Turn on the multi-gen LRU memory reclaim at boot (CONFIG_LRU_GEN_ENABLED)"
        type: boolean
        default: true
      modules:
        description: "Also build the in-tree vendor modules (dry run: checked and uploaded, not packaged)"
        type: boolean
        default: false
      vboot:
        description: "Also make a zip that swaps the 102 first-stage modules inside vendor_boot (needs modules)"
        type: boolean
        default: false
      wild:
        description: "Wild Kernels feature set: SUSFS ptrace + unicode fixes, Baseband Guard, BBRv3, IP sets/firewall/qdisc/TTL, CIFS, tmpfs xattr/ACL, fanotify"
        type: boolean
        default: true
      wild_extra:
        description: "Also NoMount VFS hooks and DroidSpaces container support (more invasive)"
        type: boolean
        default: false
      root:
        description: "Built-in root: KernelSU-Next + SUSFS compiled into the kernel, or none (keep module-mode root)"
        type: choice
        options:
          - ksun-susfs
          - none
        default: ksun-susfs

permissions:
  contents: read
  actions: read

env:
  BASELINE_RUN_ID: "42991796427"
  # Build helpers (composite actions + fix-up scripts) for the KernelSU-Next / SUSFS
  # integration. Pinned so a run is reproducible; SUSFS itself is fetched by those
  # helpers from its android13-5.15 branch tip, and the commit used is in the log.
  HELPERS_REPO: WildKernels/GKI_KernelSU_SUSFS
  HELPERS_SHA: c6d44eb9110888ad0cbc8e172d0d64eaa7df3e1e
  # pershoot/KernelSU-Next, branch dev-susfs (KernelSU-Next with SUSFS support)
  KSUN_SHA: aafde92ae9769b42567d8db5feefd838c591633b
  # futex_waitv backport for 5.15 (upstream since 5.16), from the linux-tkg patch set
  TKG_REPO: Frogging-Family/linux-tkg
  TKG_SHA: 8a0cd766bac5c59957208be92a8ad4538df8e971
  # Baseband Guard (vc-teahouse/Baseband-guard), NoMount (maxsteeel/nomount, dev),
  # DroidSpaces (ravindu644/Droidspaces-OSS) - all pinned
  BBG_SHA: 028ff7fd509e2104596da7cc1ef8e6ce2a0c9082
  NOMOUNT_SHA: 7914458ca71dfa3a8c162fa97fdb69332db7a690
  DROIDSPACES_SHA: cdadb9eb5d0f86aacffff60776333e6f6b73a30a
  PATCHES_REPO: WildKernels/kernel_patches
  PATCHES_SHA: b6690c6c66a05f873faf460daaaac1c84de9d720
  KERNEL_REPO: ishtar-aosp/android_kernel_xiaomi_sm8550
  KERNEL_SHA: 34eaaccbb3d71edb8e03eb903d113e0e105b6237
  KERNEL_RELEASE: 5.15.211-g34eaaccbb3d7
  LOCALVER: -g34eaaccbb3d7
  MAKE_ARGS: O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 LOCALVERSION=
  KBUILD_BUILD_USER: build
  KBUILD_BUILD_HOST: github

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / /mnt || true

      - name: Add swap (full LTO link needs more memory than the runner has)
        run: |
          sudo fallocate -l 16G /mnt/swap-lto || sudo fallocate -l 16G /swap-lto
          f=/mnt/swap-lto; [ -f "$f" ] || f=/swap-lto
          sudo chmod 600 "$f"
          sudo mkswap "$f"
          sudo swapon "$f"
          free -h

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio kmod zip xz-utils python3 wget gnupg gawk \
            lsb-release software-properties-common \
            libssl-dev libelf-dev dwarves
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y --no-install-recommends clang-21 lld-21 llvm-21
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          clang --version
          ld.lld --version
          pahole --version

      - name: Fetch build helpers (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HELPERS_REPO }}
          ref: ${{ env.HELPERS_SHA }}
          fetch-depth: 1

      - name: Fetch kernel source (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_SHA }}
          path: kernel/common
          fetch-depth: 1

      - name: Fetch patch set (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PATCHES_REPO }}
          ref: ${{ env.PATCHES_SHA }}
          path: kernel_patches
          fetch-depth: 1

      - name: Apply NTSync driver backport (new files only, no core changes)
        if: inputs.ntsync
        working-directory: kernel/common
        run: |
          patch -p1 --forward < "$GITHUB_WORKSPACE/kernel_patches/common/ntsync/ntsync_compat_android13-5.15.patch"
          patch -p1 --forward < "$GITHUB_WORKSPACE/kernel_patches/common/ntsync/ntsync_base.patch"
          git status --short

      - name: Fetch futex_waitv backport (pinned commit)
        if: inputs.extras
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TKG_REPO }}
          ref: ${{ env.TKG_SHA }}
          path: tkg
          fetch-depth: 1
          sparse-checkout: |
            linux-tkg-patches/5.15
          sparse-checkout-cone-mode: true

      - name: Apply futex_waitv backport (new syscall 449, as upstream)
        if: inputs.extras
        working-directory: kernel/common
        run: |
          patch -p1 --forward < "$GITHUB_WORKSPACE/tkg/linux-tkg-patches/5.15/0007-v5.15-futex_waitv.patch"
          grep -n 'futex_waitv' include/uapi/asm-generic/unistd.h

      - name: Set git identity (the SUSFS helper cherry-picks two commits)
        run: |
          git config --global user.name "ishtar-kernel-ci"
          git config --global user.email "ci@users.noreply.github.com"

      - name: Integrate KernelSU-Next (built in)
        if: inputs.root == 'ksun-susfs'
        uses: ./.github/actions/root-setup
        with:
          flavor: next
          commit: ${{ env.KSUN_SHA }}

      - name: Integrate SUSFS (built in)
        if: inputs.root == 'ksun-susfs'
        uses: ./.github/actions/susfs
        with:
          enabled: "true"
          susfs_commit: ""
          version: android13-5.15
          android_version: android13
          kernel_version: "5.15"
          os_patch_level: "2026-09"
          sublevel: "211"
          root_flavor: next

      - name: Baseband Guard - fetch pinned source and wire it into security/
        if: inputs.wild
        working-directory: kernel
        run: |
          git clone -q https://github.com/vc-teahouse/Baseband-guard Baseband-guard
          git -C Baseband-guard checkout -q "$BBG_SHA"
          test "$(git -C Baseband-guard rev-parse HEAD)" = "$BBG_SHA"
          sh Baseband-guard/setup.sh "$BBG_SHA"
          test "$(git -C Baseband-guard rev-parse HEAD)" = "$BBG_SHA"
          python3 "$GITHUB_WORKSPACE/.github/scripts/bbg_618_compat.py" common/security/baseband-guard
          # add baseband_guard to the default LSM list (same edit the Wild build makes)
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig
          grep -n 'baseband' common/security/Kconfig common/security/Makefile

      - name: Baseband Guard - enable
        if: inputs.wild
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_BBG=y

      - name: Networking set (IP sets, firewall targets, qdiscs, TTL, BBRv3, CIFS)
        if: inputs.wild
        uses: ./.github/actions/networking
        with:
          version: android13-5.15
          kernel_version: "5.15"
          android_version: android13
          sublevel: "211"
          os_patch_level: lts

      - name: SUSFS companion fix - ptrace leak
        if: inputs.wild && inputs.root == 'ksun-susfs'
        uses: ./.github/actions/ptrace
        with:
          kernel_version: "5.15"

      - name: SUSFS companion fix - unicode path bypass
        if: inputs.wild && inputs.root == 'ksun-susfs'
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: "5.15"

      - name: Misc configs (tmpfs xattr/ACL, fanotify, overlayfs, kallsyms)
        if: inputs.wild
        uses: ./.github/actions/misc
        with:
          version: android13-5.15
          kernel_version: "5.15"
          android_version: android13
          sublevel: "211"
          variant: Normal

      - name: DroidSpaces container support
        if: inputs.wild_extra
        uses: ./.github/actions/droidspaces
        with:
          version: android13-5.15
          android_version: android13
          kernel_version: "5.15"
          os_patch_level: "2026-09"
          sublevel: "211"
          droidspaces_commit: ${{ env.DROIDSPACES_SHA }}

      - name: NoMount VFS hooks
        if: inputs.wild_extra
        uses: ./.github/actions/nomount
        with:
          commit: ${{ env.NOMOUNT_SHA }}
          kernel_version: "5.15"

      - name: Fail on rejected patch hunks
        working-directory: kernel/common
        run: |
          # ignore .rej files that are part of the source tree itself
          rej="$(find . -name '*.rej' -not -path './out/*' | while read -r f; do
                   git ls-files --error-unmatch "$f" >/dev/null 2>&1 || echo "$f"; done | head -n 20)"
          if [ -n "$rej" ]; then
            echo "::error::Some patch hunks were rejected:"; echo "$rej"; exit 1
          fi
          echo "No rejected hunks."

      - name: Show source changes made by the integrations
        working-directory: kernel/common
        run: |
          git status --short | head -n 80
          git diff --stat | tail -n 5
          echo "--- root/SUSFS lines in gki_defconfig"
          grep -E 'CONFIG_KSU' arch/arm64/configs/gki_defconfig || true

      - name: Configure (same recipe as the ROM device tree)
        working-directory: kernel/common
        run: |
          make $MAKE_ARGS gki_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/kalama_GKI.config \
            arch/arm64/configs/vendor/ishtar_GKI.config
          # Normalise the merged file first. The last fragment has no trailing
          # newline, so anything scripts/config appends would be glued onto its
          # final line and silently lost.
          make $MAKE_ARGS olddefconfig
          # Build-only changes: none of these alter the module interface.
          scripts/config --file out/.config \
            -d WERROR \
            -d LOCALVERSION_AUTO \
            --set-str LOCALVERSION "$LOCALVER"
          if [ "${{ inputs.lto }}" = "thin" ]; then
            scripts/config --file out/.config -d LTO_CLANG_FULL -e LTO_CLANG_THIN
          fi
          if [ "${{ inputs.bbr }}" = "true" ]; then
            scripts/config --file out/.config \
              -e TCP_CONG_ADVANCED -e TCP_CONG_CUBIC -e TCP_CONG_BBR \
              -d TCP_CONG_BIC -d TCP_CONG_WESTWOOD -d TCP_CONG_HTCP \
              -d DEFAULT_CUBIC -e DEFAULT_BBR
          fi
          if [ "${{ inputs.ntsync }}" = "true" ]; then
            scripts/config --file out/.config -e NTSYNC
          fi
          if [ "${{ inputs.mglru }}" = "true" ]; then
            scripts/config --file out/.config -e LRU_GEN_ENABLED
          fi
          if [ "${{ inputs.extras }}" = "true" ]; then
            scripts/config --file out/.config -e LRU_GEN_ENABLED -e NTFS3_FS
          fi
          if [ "${{ inputs.wild }}" = "true" ]; then
            # keep the extra congestion controls the networking set turned on
            scripts/config --file out/.config \
              -e TCP_CONG_BIC -e TCP_CONG_WESTWOOD -e TCP_CONG_HTCP -e TCP_CONG_BBR3
          fi
          echo "--- TCP options before olddefconfig"
          grep -E 'CONFIG_(TCP_CONG_|DEFAULT_(BBR|CUBIC|RENO|TCP_CONG))' out/.config || true
          make $MAKE_ARGS olddefconfig
          echo "--- TCP options after olddefconfig"
          grep -E 'CONFIG_(TCP_CONG_|DEFAULT_(BBR|CUBIC|RENO|TCP_CONG))' out/.config || true
          if [ "${{ inputs.bbr }}" = "true" ]; then
            grep -x 'CONFIG_TCP_CONG_BBR=y' out/.config
            grep -x 'CONFIG_DEFAULT_TCP_CONG="bbr"' out/.config
          fi
          if [ "${{ inputs.ntsync }}" = "true" ]; then
            grep -x 'CONFIG_NTSYNC=y' out/.config
          fi
          if [ "${{ inputs.extras }}" = "true" ]; then
            grep -x 'CONFIG_LRU_GEN_ENABLED=y' out/.config
            grep -x 'CONFIG_NTFS3_FS=y' out/.config
          fi
          if [ "${{ inputs.mglru }}" = "true" ]; then
            grep -x 'CONFIG_LRU_GEN_ENABLED=y' out/.config
          fi
          if [ "${{ inputs.wild }}" = "true" ]; then
            for c in BBG TCP_CONG_BBR3 TCP_CONG_WESTWOOD IP_SET NETFILTER_XT_SET NET_SCH_CAKE \
                     IP_NF_TARGET_TTL CIFS TMPFS_XATTR TMPFS_POSIX_ACL FANOTIFY; do
              grep -x "CONFIG_$c=y" out/.config
            done
            grep -E '^CONFIG_LSM=.*baseband_guard' out/.config
          fi
          if [ "${{ inputs.wild_extra }}" = "true" ]; then
            for c in NOMOUNT SYSVIPC POSIX_MQUEUE IPC_NS PID_NS USER_NS; do
              grep -x "CONFIG_$c=y" out/.config
            done
          fi
          if [ "${{ inputs.root }}" = "ksun-susfs" ]; then
            grep -x 'CONFIG_KSU=y' out/.config
            grep -x 'CONFIG_KSU_SUSFS=y' out/.config
            grep -E '^CONFIG_KSU' out/.config
          fi
          grep -E '^CONFIG_(LOCALVERSION|LTO_CLANG_THIN|LTO_CLANG_FULL|MODVERSIONS|CFI_CLANG|DEBUG_INFO_BTF|MODULE_ALLOW_BTF_MISMATCH|TARGET_PRODUCT_ISHTAR|SCHED_WALT|HZ)=' out/.config
          cp out/.config "$GITHUB_WORKSPACE/kernel.config"

      - name: Print full config (for comparison with the phone's running config)
        working-directory: kernel/common
        run: |
          echo "::group::kernel config"
          grep -E '^(CONFIG_|# CONFIG_)' out/.config | sed 's/^/CFG| /'
          echo "::endgroup::"

      - name: Build kernel Image
        working-directory: kernel/common
        run: |
          set -o pipefail
          make -j"$(nproc)" $MAKE_ARGS Image 2>&1 | tee "$GITHUB_WORKSPACE/build.log" | tail -n 400
          ls -lh out/arch/arm64/boot/Image
          if [ "${{ inputs.extras }}" = "true" ]; then
            grep -E ' (__arm64_sys_futex_waitv|sys_futex_waitv)$' out/System.map
          fi

      - name: Build in-tree vendor modules (dry run)
        if: inputs.modules
        continue-on-error: true
        working-directory: kernel/common
        run: |
          set -o pipefail
          make -j"$(nproc)" $MAKE_ARGS modules 2>&1 | tail -n 60
          rm -rf "$GITHUB_WORKSPACE/mods"
          make $MAKE_ARGS INSTALL_MOD_PATH="$GITHUB_WORKSPACE/mods" INSTALL_MOD_STRIP=1 modules_install > /dev/null
          find "$GITHUB_WORKSPACE/mods" -name '*.ko' | wc -l

      - name: Fetch this repo's module lists
        if: inputs.modules
        uses: actions/checkout@v4
        with:
          path: ishtar-ci
          fetch-depth: 1
          sparse-checkout: .github/ishtar

      - name: Module coverage report
        if: inputs.modules
        continue-on-error: true
        run: |
          d="$GITHUB_WORKSPACE/ishtar-ci/.github/ishtar"
          norm() { sed 's/\.ko$//; s/-/_/g' | sort -u; }
          find mods -name '*.ko' -printf '%f\n' | norm > built.txt
          norm < "$d/modules.load.first_stage" > first_stage.txt
          norm < "$d/modules.load.vendor_dlkm" > vendor_dlkm.txt
          sort -u "$d/phone_loaded_modules.txt" > loaded.txt
          echo "modules built from the kernel tree: $(wc -l < built.txt)"
          echo "first-stage (vendor_boot) modules reproduced: $(comm -12 first_stage.txt built.txt | wc -l) of $(wc -l < first_stage.txt)"
          echo "vendor_dlkm modules reproduced: $(comm -12 vendor_dlkm.txt built.txt | wc -l) of $(wc -l < vendor_dlkm.txt)"
          echo "modules loaded on the phone reproduced: $(comm -12 loaded.txt built.txt | wc -l) of $(wc -l < loaded.txt)"
          echo "--- first-stage modules NOT built from the kernel tree:"
          comm -23 first_stage.txt built.txt
          for m in sched-walt qcom-cpufreq-hw thermal_pause msm_lmh_dcvs; do
            f="$(find mods -name "$m.ko" | head -n 1)"
            [ -n "$f" ] && echo "$m: $(modinfo -F vermagic "$f")"
          done
          mkdir -p first_stage_mods
          while read -r m; do
            f="$(find mods -name "$m" | head -n 1)"
            [ -n "$f" ] && cp "$f" first_stage_mods/
          done < "$d/modules.load.first_stage"
          ls first_stage_mods | wc -l
          sed 's/^/BUILTMOD| /' built.txt

      - name: Module CRC gate (symbols the phone's unchanged modules import)
        if: inputs.vboot
        run: |
          v="$GITHUB_WORKSPACE/ishtar-ci/.github/ishtar/vdlkm_versions.txt"
          [ -s "$v" ] || { echo "::error::$v missing - collect it from the phone first"; exit 1; }
          test "$(ls first_stage_mods/*.ko | wc -l)" -eq 102
          # our build: symbol -> CRC, for every export (kernel and modules)
          awk '{print $2, tolower($1)}' kernel/common/out/Module.symvers | sort -u > ours.txt
          # phone: symbols imported by its vendor_dlkm modules, with the CRC they expect
          awk 'NF==3 {print $2, tolower($3)}' "$v" | sort -u > want.txt
          join want.txt ours.txt | awk '$2 != $3' > mismatch.txt
          echo "imports checked: $(wc -l < want.txt); found in our build: $(join want.txt ours.txt | wc -l)"
          echo "CRC mismatches: $(wc -l < mismatch.txt)"
          if [ -s mismatch.txt ]; then
            head -n 40 mismatch.txt
            echo "::error::The phone's vendor_dlkm modules expect different CRCs - the vendor_boot zip would break them."
            exit 1
          fi
          echo "CRC gate passed: every import the phone's modules expect matches this build."

      - name: Upload first-stage modules (not flashable yet)
        if: inputs.modules
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: first-stage-modules
          path: first_stage_mods/

      - name: Verify release string
        working-directory: kernel/common
        run: |
          strings out/arch/arm64/boot/Image > /tmp/image-strings.txt
          banner="$(grep -m1 '^Linux version [0-9]' /tmp/image-strings.txt || true)"
          echo "$banner"
          case "$banner" in
            "Linux version $KERNEL_RELEASE "*) echo "Release string matches the running kernel." ;;
            *) echo "::error::Release string differs from $KERNEL_RELEASE - do not flash."; exit 1 ;;
          esac
          cp out/vmlinux.symvers "$GITHUB_WORKSPACE/vmlinux.symvers" 2>/dev/null \
            || cp out/Module.symvers "$GITHUB_WORKSPACE/vmlinux.symvers" 2>/dev/null \
            || echo "No symvers file found (not fatal)."

      - name: Fetch baseline symbol table (build 1, verified on the phone)
        uses: actions/download-artifact@v4
        with:
          name: build-records
          path: baseline
          run-id: ${{ env.BASELINE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: ABI gate (exported symbols and CRCs must match the baseline)
        run: |
          # symvers columns: CRC, symbol, module, export type
          awk '{print $2, $1}' baseline/vmlinux.symvers | sort > base.txt
          awk '{print $2, $1}' vmlinux.symvers | sort > new.txt
          echo "baseline symbols: $(wc -l < base.txt), new build: $(wc -l < new.txt)"
          test "$(wc -l < base.txt)" -gt 1000
          comm -23 base.txt new.txt > broken.txt
          comm -13 base.txt new.txt > added.txt
          echo "added or changed in new build: $(wc -l < added.txt)"
          if [ -s broken.txt ]; then
            echo "::error::$(wc -l < broken.txt) baseline symbols are missing or have a different CRC - the ROM's modules may not load. Do not flash."
            head -n 50 broken.txt
            exit 1
          fi
          echo "ABI gate passed: every baseline symbol is present with an identical CRC."

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          cd ak3
          rm -rf .git .github README.md
          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 script - Xiaomi 13 Ultra (ishtar), kernel Image only
          properties() { '
          kernel.string=ishtar 5.15.211 custom build (KernelSU-Next + SUSFS + Wild set, kernel Image only)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=ishtar
          device.name2=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install: replace the kernel, keep everything else as it is
          split_boot;
          flash_boot;
          EOF
          cp "$GITHUB_WORKSPACE/kernel/common/out/arch/arm64/boot/Image" .
          zip -r9 "$GITHUB_WORKSPACE/ishtar-kernel-AK3.zip" .
          ls -lh "$GITHUB_WORKSPACE/ishtar-kernel-AK3.zip"

      - name: Package kernel + vendor_boot modules zip
        if: inputs.vboot
        run: |
          rm -rf ak3v && cp -a ak3 ak3v && cd ak3v
          rm -f Image ishtar-kernel-AK3.zip anykernel.sh
          mkdir -p kimg vbmods
          cp "$GITHUB_WORKSPACE/kernel/common/out/arch/arm64/boot/Image" kimg/
          cp "$GITHUB_WORKSPACE"/first_stage_mods/*.ko vbmods/
          test "$(ls vbmods/*.ko | wc -l)" -eq 102
          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 script - Xiaomi 13 Ultra (ishtar)
          ### kernel Image + the 102 first-stage modules inside vendor_boot
          properties() { '
          kernel.string=ishtar 5.15.211 custom build (kernel + vendor_boot modules)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=ishtar
          device.name2=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ## 1) vendor_boot: unpack and check every module before anything is written
          BLOCK=vendor_boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;

          dump_boot;

          field() { tr '\000' '\n' < "$1" | grep -m1 "^$2="; }
          checked=0;
          for m in $AKHOME/vbmods/*.ko; do
            name=$(basename $m);
            hits=0;
            for t in $VENDORRD/*/lib/modules/$name; do
              [ -f "$t" ] || continue;
              hits=$((hits+1));
              [ "$(field $m vermagic)" == "$(field $t vermagic)" ] || abort "vermagic differs for $name. Nothing was flashed.";
              [ "$(field $m depends)" == "$(field $t depends)" ] || abort "dependencies differ for $name. Nothing was flashed.";
            done;
            [ $hits -gt 0 ] || abort "$name not found in vendor_boot. Nothing was flashed.";
            checked=$((checked+1));
          done;
          [ $checked -eq 102 ] || abort "Expected 102 modules, checked $checked. Nothing was flashed.";
          ui_print "All 102 modules match vendor_boot (vermagic and dependencies).";

          replaced=0;
          for m in $AKHOME/vbmods/*.ko; do
            for t in $VENDORRD/*/lib/modules/$(basename $m); do
              [ -f "$t" ] && cp -f $m $t && replaced=$((replaced+1));
            done;
          done;
          ui_print "Replaced $replaced module file(s) in vendor_boot.";

          write_boot;

          ## 2) boot: replace the kernel Image, keep everything else
          mv -f $AKHOME/kimg/Image $AKHOME/Image;
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          reset_ak;

          split_boot;
          flash_boot;
          EOF
          sed -i 's/^          //' anykernel.sh
          bash -n anykernel.sh
          zip -r9 "$GITHUB_WORKSPACE/ishtar-kernel-vboot-AK3.zip" . -x '*.git*'
          ls -lh "$GITHUB_WORKSPACE/ishtar-kernel-vboot-AK3.zip"

      - name: Upload kernel + vendor_boot modules zip
        if: inputs.vboot
        uses: actions/upload-artifact@v4
        with:
          name: ishtar-kernel-vboot-AK3
          path: ishtar-kernel-vboot-AK3.zip

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ishtar-kernel-AK3
          path: ishtar-kernel-AK3.zip

      - name: Upload build records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-records
          path: |
            kernel.config
            vmlinux.symvers
            build.log
          if-no-files-found: ignore
